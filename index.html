<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOOOHH ANIBERSARI NA MEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ea4cea, #ffe4ec, #900376);
            font-family: "Baloo 2", cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: #c539be;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #730c6e;
            margin-bottom: 30px;
            text-align: center;
        }

        .tulips-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tulip {
            width: 90px;
            height: 140px;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
        }

        .tulip:hover {
            transform: scale(1.15) translateY(-10px);
        }

        .tulip-flower {
            width: 70px;
            height: 70px;
            background: #e91e63;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            margin: 0 auto;
            box-shadow: inset -8px -8px 0 #c2185b;
        }

        .tulip-flower::before,
        .tulip-flower::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 50px;
            background: #e91e63;
            border-radius: 50%;
            top: 10px;
        }

        .tulip-flower::before {
            left: -15px;
            transform: rotate(-25deg);
        }

        .tulip-flower::after {
            right: -15px;
            transform: rotate(25deg);
        }

        .tulip-stem {
            width: 6px;
            height: 60px;
            background: #2e7d32;
            margin: 0 auto;
            border-radius: 3px;
        }

        .tulip-leaf {
            position: absolute;
            width: 25px;
            height: 20px;
            background: #43a047;
            border-radius: 50%;
            bottom: 40px;
            left: 20px;
            transform: rotate(-30deg);
        }

        /* Different colors */
        .tulip:nth-child(1) .tulip-flower { background: #b418ac; box-shadow: inset -8px -8px 0 #b418ac; }
        .tulip:nth-child(1) .tulip-flower::before,
        .tulip:nth-child(1) .tulip-flower::after { background: #b418ac; }

        .tulip:nth-child(2) .tulip-flower { background: #ba00a7; box-shadow: inset -8px -8px 0 #ba00a7; }
        .tulip:nth-child(2) .tulip-flower::before,
        .tulip:nth-child(2) .tulip-flower::after { background: #ba00a7; }

        .letter {
            display: none;
            background: #fffdf7;
            width: 90%;
            max-width: 520px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            position: relative;
            animation: openLetter 0.8s ease forwards;
            border: 1px solid #f8bbd0;
        }

        .letter h2 {
            font-family: "Baloo 2", cursive;
            font-size: 2.4rem;
            color: #c2185b;
            text-align: center;
            margin-bottom: 20px;
        }

        .letter p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #4a4a4a;
            margin-bottom: 14px;
        }

        @keyframes openLetter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .close-btn {
            display: block;
            margin: 25px auto 0;
            padding: 10px 25px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            background: #c2185b;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: #c2185b;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            animation: floatHeart 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 600px) {
            body {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 40px;
            }

            h1 {
                font-size: clamp(1.8rem, 9vw, 2.8rem);
                margin-bottom: 8px;
            }

            .subtitle {
                font-size: clamp(0.95rem, 4vw, 1.1rem);
                margin-bottom: 25px;
                padding: 0 10px;
            }

            .tulips-container {
                gap: 30px;
                margin-bottom: 25px;
            }

            .tulip {
                width: 80px;
                height: 125px;
            }

            .tulip-flower {
                width: 60px;
                height: 60px;
            }

            .letter {
                width: 95%;
                padding: 25px 18px;
                margin-top: 10px;
            }

            .letter h2 {
                font-size: 1.6rem;
            }

            .letter p {
                font-size: 1rem;
            }

            .close-btn {
                padding: 10px 20px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="hearts" id="hearts"></div>

        <source src="tadhana.mp3" type="audio/mp3">
    </audio>

    <button class="music-btn" id="musicBtn" onclick="toggleMusic()"></button>

    </div>

    <div class="letter" id="letter">
        <h2 id="letter-title"></h2>
        <div id="letter-content"></div>
        <button class="close-btn" onclick="closeLetter()">Close Letter</button>

    <script>

                `
            },
        };

        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = true;

        window.addEventListener('DOMContentLoaded', () => {
            const playPromise = music.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    musicBtn.textContent = '';
                }).catch(() => {
                    isPlaying = false;
                    musicBtn.textContent = '';
                });
            }
        });

        function openLetter(num) {
            if (!isPlaying) {
                music.play();
                isPlaying = true;
                musicBtn.textContent = '';
            }

            const letter = letters[num];
            document.getElementById('letter-title').textContent = letter.title;
            document.getElementById('letter-content').innerHTML = letter.content;
            document.getElementById('letter').style.display = 'block';
            createHearts();
        }

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '';
            } else {
                music.play();
                musicBtn.textContent = '';
            }
            isPlaying = !isPlaying;
        }

        function closeLetter() {
            document.getElementById('letter').style.display = 'none';
        }

        function createHearts() {
            const container = document.getElementById('hearts');
            for (let i = 0; i < 12; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '💕';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                container.appendChild(heart);

                setTimeout(() => heart.remove(), 6000);
            }
        }
    </script>
</body>
</html>
